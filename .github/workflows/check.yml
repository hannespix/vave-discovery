# npm run check auf jedem PR (und auf Knopfdruck).
# Pushes auf main prüft pages.yml, dort ist der Check die Vorstufe des Deploys.
name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
