# npm run check (Umfrage) und der Build des Prototyps (prototype/) auf jedem PR (und auf Knopfdruck) – als zwei Jobs:
# Ein kaputter Prototyp färbt nur die Zeile „prototype“ rot, der Check der Umfrage bleibt davon unberührt.
# Pushes auf main prüft pages.yml, dort ist der Check die Vorstufe des Deploys.
name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm run check

  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Prototyp bauen und prüfen
        if: hashFiles('prototype/package-lock.json') != ''
        working-directory: prototype
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node ../scripts/check-prototype.mjs
