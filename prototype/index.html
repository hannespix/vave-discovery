<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="UI-Entwurf für VAVE Studio – Prototyp mit Beispieldaten, ohne Backend.">
<meta name="theme-color" content="#641dff">
<meta name="color-scheme" content="light dark">
<title>VAVE Studio-Tool (Prototyp)</title>
<script>
  /* Darstellung vor dem ersten Rendern setzen (kein Aufblitzen); Schlüssel wie src/lib/theme.js */
  try {
    var t = localStorage.getItem('vave-proto:theme');
    document.documentElement.setAttribute('data-theme', t === 'light' || t === 'dark' ? t : 'system');
  } catch (e) { document.documentElement.setAttribute('data-theme', 'system'); }
</script>
</head>
<body>
<div id="root"></div>
<noscript>Dieser Prototyp braucht JavaScript.</noscript>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
