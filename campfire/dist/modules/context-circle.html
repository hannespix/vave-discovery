:root {
  color-scheme: dark;
  /* Night: the LCD greens of pix·el, darkened for a campfire evening */
  --night-0: #050a05;
  --night-1: #0c170b;
  --night-2: #12210f;
  --night-3: #1b2d17;
  --night-4: #2a4123;
  --lcd-a: #306230;
  --lcd-b: #4c7420;
  --lcd-c: #7a9a1c;
  --lcd-d: #a9c431;
  --lcd-e: #d4ef78;
  --lcd-f: #e3efa8;
  /* Fire: the only warm colours (pixletics flame + pix·el LED) */
  --fire-0: #e8483f;
  --fire-1: #ff5a36;
  --fire-2: #ffae00;
  --fire-3: #ffe06a;
  --fire-4: #fff6c8;
  --wood-0: #3a2414;
  --wood-1: #6b4226;
  --wood-2: #9a6a3c;
  /* Text and lines */
  --ink: #e2f0c6;
  --muted: #9fb48f;
  --line: #2a4123;
  --marker: #ffe45e;
  --bg: var(--night-1);
  --card: var(--night-2);

  --pixel: "Jersey 10", "Courier New", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;

  --px: 4px;            /* one art pixel on screen (scenes scale in whole multiples) */
  --step: 125ms;        /* one animation frame = 8 fps */
  --gutter: max(16px, 4vw);
  --radius: 0;          /* pixel world: no rounded corners */
}

/* Light variant for projectors that wash out dark slides: add data-theme="light" on <html> */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7ef;
  --card: #ffffff;
  --ink: #12280f;
  --muted: #56654f;
  --line: #d3dcc4;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 18px/1.55 var(--sans);
}

/* Headlines and labels in the pixel font — big, never for long sentences */
.px-title { font-family: var(--pixel); font-weight: 400; letter-spacing: 0.02em; line-height: 0.95; }
.px-label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

/* Pixel art: crisp at every scale */
.pixelart, .pixelart svg, svg.pixelart { image-rendering: pixelated; shape-rendering: crispEdges; }

/* Pixel frame: a 1-art-pixel border with cut corners, like an old handheld UI */
.px-frame {
  background: var(--card);
  border: var(--px) solid var(--night-4);
  box-shadow: 0 0 0 var(--px) var(--night-0), var(--px) var(--px) 0 var(--px) var(--night-0);
}

/* Buttons that feel like hardware keys */
.px-btn {
  font: 20px/1 var(--pixel);
  color: var(--night-0);
  background: var(--lcd-d);
  border: 0;
  padding: 12px 18px;
  min-height: 44px;
  cursor: pointer;
  box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--lcd-b), 0 var(--px) 0 var(--night-0);
}
.px-btn:hover { background: var(--lcd-e); }
.px-btn:active { transform: translateY(var(--px)); box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--lcd-b); }
.px-btn.fire { background: var(--fire-2); box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--fire-1), 0 var(--px) 0 var(--night-0); }
.px-btn.fire:hover { background: var(--fire-3); }

:focus-visible { outline: 3px solid var(--marker); outline-offset: 3px; }

/* Flicker helpers for HTML (SVG scenes carry their own copy of these keyframes) */
@keyframes px-flicker { 0% { opacity: 1; } 50% { opacity: 0.82; } 100% { opacity: 1; } }
@keyframes px-frames-3 { from { transform: translateX(0); } to { transform: translateX(-300%); } }
@keyframes px-blink { 0%, 92% { opacity: 1; } 93%, 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  /* ── Rendering ───────────────────────────────────────────────────────────── */

  function check(name, rows) {
    const w = rows[0].length;
    rows.forEach((r, i) => { if (r.length !== w) throw new Error(`PX: sprite "${name}" row ${i} has ${r.length} px, expected ${w}`); });
    return w;
  }

  /** Path data for every pixel equal to `ch` (runs merged), offset by ox/oy */
  function runPath(rows, ch, ox, oy) {
    let d = '';
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] !== ch) continue;
        let n = 1;
        while (row[x + n] === ch) n++;
        d += `M${ox + x} ${oy + y}h${n}v1h-${n}z`;
        x += n - 1;
      }
    });
    return d;
  }

  /** Sprite → '<path fill=… d=…/>' per colour. opts: { x, y, pal (overrides), cls } */
  function sprite(nameOrRows, opts) {
    const o = opts || {};
    const rows = typeof nameOrRows === 'string' ? SPRITES[nameOrRows] : nameOrRows;
    if (!rows) throw new Error(`PX: unknown sprite "${nameOrRows}"`);
    check(String(nameOrRows), rows);
    const pal = Object.assign({}, PAL, o.pal || {});
    const chars = [...new Set(rows.join(''))].filter((c) => c !== '.');
    const cls = o.cls ? ` class="${o.cls}"` : '';
    return `<g${cls}>${chars.map((c) => `<path fill="${pal[c] || c}" d="${runPath(rows, c, o.x || 0, o.y || 0)}"/>`).join('')}</g>`;
  }

  /** Icon → one path (fill = currentColor unless given) */
  function icon(name, opts) {
    const o = opts || {};
    const rows = ICONS[name];
    if (!rows) throw new Error(`PX: unknown icon "${name}"`);
    check(name, rows);
    return `<path fill="${o.fill || 'currentColor'}" d="${runPath(rows, '#', o.x || 0, o.y || 0)}"/>`;
  }

    const desc = o.desc ? `<desc>${o.desc}</desc>` : '';
    const style = o.css ? `<style>${o.css}</style>` : '';
    const bg = o.bg ? `<rect width="${o.w}" height="${o.h}" fill="${o.bg}"/>` : '';
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${o.w} ${o.h}" width="${o.w * (o.scale || 1)}" height="${o.h * (o.scale || 1)}" shape-rendering="crispEdges" role="img">${title}${desc}${style}${bg}${o.body}</svg>`;

  /** Width of one line (or the widest line) in px at the given scale (default 1) */
  function textWidth(str, scale) {
    const s = scale || 1;
    return Math.max(...String(str).split('\n').map((line) => {
      const w = [...line].reduce((a, ch) => a + glyph(ch)[0].length + 1, 0);
      return Math.max(0, w - 1) * s;
    }));
  }

  /** Text → one '<path>' of merged pixel runs. opts: { x, y (top edge), fill, scale, align: 'left'|'center'|'right' }.
      '\n' starts a new line (9 px line height × scale). Default fill = PAL.i (ink on night). */
  function text(str, opts) {
    const o = opts || {};
    const s = o.scale || 1;
    let d = '';
    String(str).split('\n').forEach((line, li) => {
      const lw = textWidth(line, s);
      let cx = (o.x || 0) - (o.align === 'center' ? Math.floor(lw / 2) : o.align === 'right' ? lw : 0);
      const cy = (o.y || 0) + li * LINE_H * s;
      for (const ch of line) {
        const rows = glyph(ch);
        rows.forEach((row, ry) => {
          for (let x = 0; x < row.length; x++) {
            if (row[x] !== '#') continue;
            let n = 1;
            while (row[x + n] === '#') n++;
            d += `M${cx + x * s} ${cy + ry * s}h${n * s}v${s}h-${n * s}z`;
            x += n - 1;
          }
        });
        cx += (rows[0].length + 1) * s;
      }
    });
    return `<path fill="${o.fill || PAL.i}" d="${d}"/>`;
  }

      '...#..#..#..#...', '...#..#..#..#...', '...#..#..#..#...', '...#..#..#..#...',
      '...##########...', '....########....', '.....######.....', '......####......',
      '.......##.......', '.......##.......', '.......##.......', '.......##.......',
      '.......##.......', '......####......', '......####......', '.......##.......',
    ],
    issue: [ // sticky note for the quest board
      '................', '.##############.', '.#............#.', '.#.....##.....#.',
      '.#.....##.....#.', '.#.....##.....#.', '.#.....##.....#.', '.#.....##.....#.',
      '.#............#.', '.#.....##.....#.', '.#.....##.....#.', '.#.........####.',
      '.#.........#.#..', '.#.........##...', '.###########....', '................',
    ],
    org: [ // the guild hall
      '.......#####....', '.......####.....', '.......#........', '.......##.......',
      '.....##..##.....', '...##......##...', '.##..........##.', '################',
      '..##.##..##.##..', '..##.##..##.##..', '..##.##..##.##..', '..##.##..##.##..',
      '..##.##..##.##..', '.##############.', '################', '................',
    ],
  };

  /** Item icon → one path (fill = currentColor unless given). opts: { x, y, fill } */
  function item(id, opts) {
    const o = opts || {};
    const rows = ITEMS[id];
    if (!rows) throw new Error(`PX: unknown item "${id}"`);
    check(id, rows);
    return `<path fill="${o.fill || 'currentColor'}" d="${runPath(rows, '#', o.x || 0, o.y || 0)}"/>`;
  }

  Object.assign(root.PX, { ITEMS, item });
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<body>
<header class="top">
  <h1 class="px-title">Context Circle</h1>
  <p><b>It only sees what's inside the circle of light.</b> <span class="more">Everything in the dark doesn't exist for it.</span></p>
</header>

<main>
  <section class="stage" id="stage" aria-label="The chat around the fire">
    <svg class="pool pixelart" id="pool" shape-rendering="crispEdges" aria-hidden="true"></svg>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="hearth" id="hearth">
      <div class="pin" id="pin" hidden><b>CLAUDE.md · pinned</b>Client: coffee roaster. Logo colour: violet. <span class="tok">14 tok</span></div>
      <svg class="fire pixelart" id="fire" viewBox="0 0 20 22" shape-rendering="crispEdges" aria-hidden="true"></svg>
    </div>
  </section>

  <section class="side px-frame" aria-label="Controls">
    <div class="row">
      <button class="px-btn fire" id="next" type="button">Next</button>
      <button class="px-btn" id="play" type="button">Play</button>
      <button class="px-btn" id="reset" type="button">Reset</button>
    </div>
    <div>
      <div class="knob"><label class="px-label" for="cap">Context window</label><output id="capout" for="cap">120 tokens</output></div>
      <input type="range" id="cap" min="40" max="260" step="10" value="120">
    </div>
    <label class="switch"><input type="checkbox" id="pinbox"><span class="box" aria-hidden="true"></span><span>Pin memory file (CLAUDE.md)</span></label>
    <div class="gauge" id="gauge" aria-hidden="true"></div>
    <dl class="stats" id="stats"></dl>
    <p class="lesson" id="lesson"></p>
  </section>
</main>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const CHAT = [
    ['you', 'We’re designing a trade-fair stand for a coffee roaster. Can you help me plan it?'],
    ['ai', 'Happy to. What do we know about the brand so far?'],
    ['you', 'The client’s logo colour is violet. Everything should match it.', 'fact'],
    ['ai', 'Noted, violet it is. How big is the stand?'],
    ['you', 'Six by four metres, open on two sides, with a coffee bar in one corner.'],
    ['ai', 'Then the bar can anchor the corner and pull people in from the aisle.'],
    ['you', 'We also need a wall for the product story, about four metres long.'],
    ['ai', 'A story wall on the long side, in three chapters: bean, roast, cup.'],
    ['you', 'Lighting should feel warm, like a café in the evening.'],
    ['ai', 'Warm white spots on the wall and a glowing front for the bar.'],
    ['you', 'Budget is tight, so we reuse the modular frames from last year.'],
    ['ai', 'Good call. Reused frames also save build time on site.'],
    ['you', 'Now the print files. What colour was the logo?'],
  ];
  const tokens = (s) => Math.ceil(s.length / 4); // rule of thumb: about 4 characters per token
  const MSGS = CHAT.map(([who, text, kind], i) => ({ i, who, text, kind, tok: tokens(text) }));
  const PIN_TOK = 14;
  const LAST = MSGS.length + 1; // one extra step: the answer

  const st = { step: 1, pinned: false, cap: 120, entered: 0 };

  function compute() {
    const shown = MSGS.slice(0, Math.min(st.step, MSGS.length));
    const room = st.cap - (st.pinned ? PIN_TOK : 0);
    let used = 0; const lit = new Set();
    for (let k = shown.length - 1; k >= 0; k--) {
      const m = shown[k];
      if (used + m.tok > room && lit.size) break;
      used += m.tok; lit.add(m.i);
    }
    const factLit = lit.has(2);
    const darkTok = shown.filter((m) => !lit.has(m.i)).reduce((s, m) => s + m.tok, 0);
    return { shown, lit, used, room, factLit, darkTok, darkN: shown.length - lit.size };
  }

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function render() {
    const r = compute();
    const chat = $('chat');
    let html = r.shown.map((m) => {
      const on = r.lit.has(m.i);
      const cls = ['msg', m.who, on ? 'lit' : 'dark', m.kind === 'fact' ? 'key' : '', m.i >= st.entered ? 'enter' : ''].join(' ');
      const fact = m.kind === 'fact' ? '<span class="fact">KEY FACT</span>' : '';
      const where = on ? '' : '<span class="sr" style="position:absolute;left:-9999px">(in the dark) </span>';
      return `<div class="${cls}" data-i="${m.i}">${where}<span class="tok">${m.tok} tok</span>${fact}<span class="who">${m.who === 'you' ? 'You' : 'AI'}</span>${esc(m.text)}</div>`;
    }).join('');
    if (st.step >= LAST) {
      const right = r.factLit || st.pinned;
      const text = right ? (r.factLit ? 'The logo is violet, as you said at the start. I’ll set the print files to violet.'
        : 'The logo is violet: it’s in CLAUDE.md. I’ll set the print files to violet.')
        : 'Probably a warm coffee brown? That would suit a coffee roaster. I’ll set the print files to brown.';
      const why = right ? (r.factLit ? 'Correct: the fact was still in the light.' : 'Correct: the pinned memory file kept the fact in the light.')
        : 'Plausible, confident and wrong. The fact had walked into the dark.';
      html += `<div class="msg ai answer${right ? '' : ' wrong'}${st.entered <= MSGS.length ? ' enter' : ''}"><span class="who">AI</span>${esc(text)}<span class="why">${why}</span></div>`;
    }
    if (!r.shown.length) html = '<p class="hint">Press Next: the first message walks up to the fire.</p>';
    chat.innerHTML = html;
    fitChat();
    st.entered = st.step;
    $('pin').hidden = !st.pinned;

    // side panel
    const cells = 26, per = st.cap / cells;
    const pinCells = st.pinned ? Math.round(PIN_TOK / per) : 0, onCells = Math.min(cells - pinCells, Math.round(r.used / per));
    $('gauge').innerHTML = Array.from({ length: cells }, (_, k) => `<i class="${k < pinCells ? 'pin' : k < pinCells + onCells ? 'on' : ''}"></i>`).join('');
    const inLight = r.used + (st.pinned ? PIN_TOK : 0);
    $('stats').innerHTML =
      `<dt>In the light</dt><dd>${inLight} / ${st.cap} tokens</dd>` +
      `<dt>In the dark</dt><dd>${r.darkN} message${r.darkN === 1 ? '' : 's'}, ${r.darkTok} tokens</dd>` +
      `<dt>Key fact</dt><dd>${st.step < 3 ? 'not said yet' : st.pinned ? 'pinned in CLAUDE.md' : r.factLit ? 'in the light' : 'in the dark'}</dd>`;
    $('lesson').textContent = st.step >= LAST
      ? (r.factLit || st.pinned ? 'Shrink the circle or unpin the file and ask again: the answer changes.' : 'Widen the context window, or pin the memory file. Then ask again.')
      : st.pinned ? 'Pinned files stay in the light, whatever the chat does. That’s why projects keep their memory in files.'
      : 'Long chats push old messages into the dark. The model can’t see them any more.';
    $('next').disabled = st.step >= LAST;
    $('next').textContent = st.step === MSGS.length ? 'Answer' : 'Next';
    $('play').textContent = playTimer ? 'Pause' : 'Play';
    requestAnimationFrame(drawPool);
  }

  /* ── Fit: the chat may not overflow its stage, and the key fact may never leave it ──
     Order: squeeze filler in the dark (oldest first), then older filler in the light; then drop dark filler,
     then older light filler. The key fact, the latest message and the answer always stay whole. */
  function fitChat() {
    const chat = $('chat');
    const msgs = [...chat.querySelectorAll('.msg')];
    if (!msgs.length) return;
    msgs.forEach((m) => m.classList.remove('squeeze', 'gone'));
    const last = msgs.filter((m) => !m.classList.contains('answer')).pop();
    const filler = msgs.filter((m) => m !== last && !m.classList.contains('key') && !m.classList.contains('answer'));
    const dark = filler.filter((m) => m.classList.contains('dark')), lit = filler.filter((m) => m.classList.contains('lit'));
    const pad = parseFloat(getComputedStyle(chat).paddingTop) || 0;
    const over = () => {
      const first = msgs.find((m) => !m.classList.contains('gone'));
      return first.getBoundingClientRect().top < chat.getBoundingClientRect().top + pad - 1;
    };
    const plan = [...dark.map((m) => [m, 'squeeze']), ...lit.map((m) => [m, 'squeeze']), ...dark.map((m) => [m, 'gone']), ...lit.map((m) => [m, 'gone'])];
    for (const [m, c] of plan) { if (!over()) break; m.classList.add(c); }
  }

  /* ── Pixel pool of light from the fire up to the oldest lit message ─────── */
  const CELL = 8;
  function drawPool() {
    const stage = $('stage'), pool = $('pool');
    const W = stage.clientWidth, H = stage.clientHeight;
    const lit = stage.querySelectorAll('.msg.lit:not(.gone), .msg.answer');
    const sTop = stage.getBoundingClientRect().top;
    let top = $('hearth').getBoundingClientRect().top - sTop - 24;
    if (lit.length) top = Math.min(top, lit[0].getBoundingClientRect().top - sTop - 14);
    top = Math.max(0, top);
    const cols = Math.ceil(W / CELL), rows = Math.ceil(H / CELL);
    const cx = W / 2, cy = H - 20, ry = Math.max(40, cy - top);
    const chatW = $('chat').clientWidth;
    const rx = Math.min(W / 2 + 40, Math.max(ry * 1.15, chatW / 2 + 36));
    const grid = [];
    for (let y = 0; y < rows; y++) {
      let row = '';
      for (let x = 0; x < cols; x++) {
        const dx = (x * CELL + CELL / 2 - cx) / rx, dy = (y * CELL + CELL / 2 - cy) / ry;
        const d = dx * dx + dy * dy;
        row += d < 0.42 ? '3' : d < 0.72 ? '2' : d < 1 ? '1' : '.';
      }
      grid.push(row);
    }
    pool.setAttribute('width', cols * CELL); pool.setAttribute('height', rows * CELL);
    pool.setAttribute('viewBox', `0 0 ${cols} ${rows}`);
    pool.innerHTML = `<g class="glow">${PX.sprite(grid, { pal: { 1: '#1a170b', 2: '#2a210f', 3: '#3a2c13' } })}</g>`;
  }

  $('fire').innerHTML = PX.sprite('fire1', { x: 2, y: 0, cls: 'fr f1' }) + PX.sprite('fire2', { x: 2, y: 0, cls: 'fr f2' }) + PX.sprite('fire3', { x: 2, y: 0, cls: 'fr f3' }) + PX.sprite('logs', { x: 0, y: 16 });

  /* ── Controls ────────────────────────────────────────────────────────────── */
  let playTimer = null;
  function stop() { clearInterval(playTimer); playTimer = null; }
  function next() { if (st.step < LAST) st.step++; if (st.step >= LAST) stop(); render(); }
  $('next').addEventListener('click', () => { stop(); next(); });
  $('play').addEventListener('click', () => {
    if (playTimer) { stop(); render(); return; }
    if (st.step >= LAST) { st.step = 0; st.entered = 0; }
    playTimer = setInterval(next, 1300); next();
  });
  $('reset').addEventListener('click', () => { stop(); st.step = 1; st.entered = 0; render(); });
  $('cap').addEventListener('input', (e) => { st.cap = +e.target.value; $('capout').textContent = st.cap + ' tokens'; render(); });
  $('pinbox').addEventListener('change', (e) => { st.pinned = e.target.checked; render(); });
  window.addEventListener('resize', () => { fitChat(); requestAnimationFrame(drawPool); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitChat(); drawPool(); });

  st.cap = +$('cap').value; st.pinned = $('pinbox').checked;
  $('capout').textContent = st.cap + ' tokens';
  render();
})();
</script>
</body>
