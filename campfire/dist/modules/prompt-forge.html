:root {
  color-scheme: dark;
  /* Night: the LCD greens of pix·el, darkened for a campfire evening */
  --night-0: #050a05;
  --night-1: #0c170b;
  --night-2: #12210f;
  --night-3: #1b2d17;
  --night-4: #2a4123;
  --lcd-a: #306230;
  --lcd-b: #4c7420;
  --lcd-c: #7a9a1c;
  --lcd-d: #a9c431;
  --lcd-e: #d4ef78;
  --lcd-f: #e3efa8;
  /* Fire: the only warm colours (pixletics flame + pix·el LED) */
  --fire-0: #e8483f;
  --fire-1: #ff5a36;
  --fire-2: #ffae00;
  --fire-3: #ffe06a;
  --fire-4: #fff6c8;
  --wood-0: #3a2414;
  --wood-1: #6b4226;
  --wood-2: #9a6a3c;
  /* Text and lines */
  --ink: #e2f0c6;
  --muted: #9fb48f;
  --line: #2a4123;
  --marker: #ffe45e;
  --bg: var(--night-1);
  --card: var(--night-2);

  --pixel: "Jersey 10", "Courier New", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;

  --px: 4px;            /* one art pixel on screen (scenes scale in whole multiples) */
  --step: 125ms;        /* one animation frame = 8 fps */
  --gutter: max(16px, 4vw);
  --radius: 0;          /* pixel world: no rounded corners */
}

/* Light variant for projectors that wash out dark slides: add data-theme="light" on <html> */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7ef;
  --card: #ffffff;
  --ink: #12280f;
  --muted: #56654f;
  --line: #d3dcc4;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 18px/1.55 var(--sans);
}

/* Headlines and labels in the pixel font — big, never for long sentences */
.px-title { font-family: var(--pixel); font-weight: 400; letter-spacing: 0.02em; line-height: 0.95; }
.px-label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

/* Pixel art: crisp at every scale */
.pixelart, .pixelart svg, svg.pixelart { image-rendering: pixelated; shape-rendering: crispEdges; }

/* Pixel frame: a 1-art-pixel border with cut corners, like an old handheld UI */
.px-frame {
  background: var(--card);
  border: var(--px) solid var(--night-4);
  box-shadow: 0 0 0 var(--px) var(--night-0), var(--px) var(--px) 0 var(--px) var(--night-0);
}

/* Buttons that feel like hardware keys */
.px-btn {
  font: 20px/1 var(--pixel);
  color: var(--night-0);
  background: var(--lcd-d);
  border: 0;
  padding: 12px 18px;
  min-height: 44px;
  cursor: pointer;
  box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--lcd-b), 0 var(--px) 0 var(--night-0);
}
.px-btn:hover { background: var(--lcd-e); }
.px-btn:active { transform: translateY(var(--px)); box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--lcd-b); }
.px-btn.fire { background: var(--fire-2); box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--fire-1), 0 var(--px) 0 var(--night-0); }
.px-btn.fire:hover { background: var(--fire-3); }

:focus-visible { outline: 3px solid var(--marker); outline-offset: 3px; }

/* Flicker helpers for HTML (SVG scenes carry their own copy of these keyframes) */
@keyframes px-flicker { 0% { opacity: 1; } 50% { opacity: 0.82; } 100% { opacity: 1; } }
@keyframes px-frames-3 { from { transform: translateX(0); } to { transform: translateX(-300%); } }
@keyframes px-blink { 0%, 92% { opacity: 1; } 93%, 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

      '.....#.#........', '.....##.........', '.....#..........', '................',

  /* ── Rendering ───────────────────────────────────────────────────────────── */

  function check(name, rows) {
    const w = rows[0].length;
    rows.forEach((r, i) => { if (r.length !== w) throw new Error(`PX: sprite "${name}" row ${i} has ${r.length} px, expected ${w}`); });
    return w;
  }

  /** Path data for every pixel equal to `ch` (runs merged), offset by ox/oy */
  function runPath(rows, ch, ox, oy) {
    let d = '';
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] !== ch) continue;
        let n = 1;
        while (row[x + n] === ch) n++;
        d += `M${ox + x} ${oy + y}h${n}v1h-${n}z`;
        x += n - 1;
      }
    });
    return d;
  }

  /** Sprite → '<path fill=… d=…/>' per colour. opts: { x, y, pal (overrides), cls } */
  function sprite(nameOrRows, opts) {
    const o = opts || {};
    const rows = typeof nameOrRows === 'string' ? SPRITES[nameOrRows] : nameOrRows;
    if (!rows) throw new Error(`PX: unknown sprite "${nameOrRows}"`);
    check(String(nameOrRows), rows);
    const pal = Object.assign({}, PAL, o.pal || {});
    const chars = [...new Set(rows.join(''))].filter((c) => c !== '.');
    const cls = o.cls ? ` class="${o.cls}"` : '';
    return `<g${cls}>${chars.map((c) => `<path fill="${pal[c] || c}" d="${runPath(rows, c, o.x || 0, o.y || 0)}"/>`).join('')}</g>`;
  }

  /** Icon → one path (fill = currentColor unless given) */
  function icon(name, opts) {
    const o = opts || {};
    const rows = ICONS[name];
    if (!rows) throw new Error(`PX: unknown icon "${name}"`);
    check(name, rows);
    return `<path fill="${o.fill || 'currentColor'}" d="${runPath(rows, '#', o.x || 0, o.y || 0)}"/>`;
  }

  /** A complete, self-contained SVG document (for files and <img>) */
  function svgDoc(o) {
    const title = o.title ? `<title>${o.title}</title>` : '';
    const desc = o.desc ? `<desc>${o.desc}</desc>` : '';
    const style = o.css ? `<style>${o.css}</style>` : '';
    const bg = o.bg ? `<rect width="${o.w}" height="${o.h}" fill="${o.bg}"/>` : '';
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${o.w} ${o.h}" width="${o.w * (o.scale || 1)}" height="${o.h * (o.scale || 1)}" shape-rendering="crispEdges" role="img">${title}${desc}${style}${bg}${o.body}</svg>`;
  }

  root.PX = { PAL, SPRITES, ICONS, sprite, icon, svgDoc, runPath };

  /* ── Additions (art set): Pix as mono icon, 5×7 pixel font ───────────────── */

  /* Pix as a single-colour icon (outline, eyes, mouth, antenna) — station 01 */

    '.........#......', '........#.......', '...##########...', '..#..........#..',

  F('6', ['..##.', '.#...', '#....', '####.', '#...#', '#...#', '.###.']);
  F('7', ['#####', '....#', '...#.', '..#..', '.#...', '.#...', '.#...']);
  F('8', ['.###.', '#...#', '#...#', '.###.', '#...#', '#...#', '.###.']);
  F('9', ['.###.', '#...#', '#...#', '.####', '....#', '...#.', '.##..']);
  F(' ', ['...', '...', '...', '...', '...', '...', '...']);
  F('.', ['.', '.', '.', '.', '.', '.', '#']);
  F(',', ['..', '..', '..', '..', '.#', '.#', '#.']);
  F(':', ['.', '.', '#', '.', '.', '#', '.']);
  F('!', ['#', '#', '#', '#', '#', '.', '#']);
  F('?', ['.###.', '#...#', '....#', '...#.', '..#..', '.....', '..#..']);
  F('-', ['....', '....', '....', '####', '....', '....', '....']);
  F('·', ['..', '..', '..', '##', '##', '..', '..']);
  F('/', ['....#', '...#.', '...#.', '..#..', '.#...', '.#...', '#....']);
  F('&', ['.##..', '#..#.', '#.#..', '.#...', '#.#.#', '#..#.', '.##.#']);
  F("'", ['#', '#', '.', '.', '.', '.', '.']);

  const glyph = (ch) => FONT5x7[ch] || FONT5x7[ch.toUpperCase()] || FONT5x7['?'];
  const LINE_H = 9; // 7 px glyph + 2 px leading

  /** Width of one line (or the widest line) in px at the given scale (default 1) */
  function textWidth(str, scale) {
    const s = scale || 1;
    return Math.max(...String(str).split('\n').map((line) => {
      const w = [...line].reduce((a, ch) => a + glyph(ch)[0].length + 1, 0);
      return Math.max(0, w - 1) * s;
    }));
  }

  /** Text → one '<path>' of merged pixel runs. opts: { x, y (top edge), fill, scale, align: 'left'|'center'|'right' }.
      '\n' starts a new line (9 px line height × scale). Default fill = PAL.i (ink on night). */
  function text(str, opts) {
    const o = opts || {};
    const s = o.scale || 1;
    let d = '';
    String(str).split('\n').forEach((line, li) => {
      const lw = textWidth(line, s);
      let cx = (o.x || 0) - (o.align === 'center' ? Math.floor(lw / 2) : o.align === 'right' ? lw : 0);
      const cy = (o.y || 0) + li * LINE_H * s;
      for (const ch of line) {
        const rows = glyph(ch);
        rows.forEach((row, ry) => {
          for (let x = 0; x < row.length; x++) {
            if (row[x] !== '#') continue;
            let n = 1;
            while (row[x + n] === '#') n++;
            d += `M${cx + x * s} ${cy + ry * s}h${n * s}v${s}h-${n * s}z`;
            x += n - 1;
          }
        });
        cx += (rows[0].length + 1) * s;
      }
    });
    return `<path fill="${o.fill || PAL.i}" d="${d}"/>`;
  }

  Object.assign(root.PX, { FONT5x7, text, textWidth });

      weak: 'make a colour checker',
      who: 'Designers and project managers who check client palettes before a pitch.',
      goal: 'A one-page tool that shows whether two brand colours are readable together.',
      context: 'Palettes arrive as hex codes in client briefs. Today we guess, and accessibility problems show up late.',
      constraints: 'One HTML file, works offline, no libraries. Use the WCAG contrast formula. Nothing leaves the browser.',
      done: 'I paste two hex codes and instantly see the ratio, pass or fail for normal and large text, and a live preview.',
      look: 'Precise like a lab instrument: monospace numbers, big colour swatches, no decoration.',
      weakResult: 'A colour picker that shows some number. Which standard? What about large text? Unclear.',
      strongResult: 'Two hex fields, the contrast ratio, pass or fail for normal and large text, and a preview. Works offline.',
    },
  };
  const LEVELS = ['Cold ashes', 'A spark', 'Smouldering', 'Kindling catches', 'Steady fire', 'Roaring', 'Forge-hot'];

  const st = { task: 'printer', view: 'build', on: new Set() };

  /* ── Fire meter: whole campfire grows with the level ─────────────────────── */
  function fireSvg(level, unit) {
    let body = PX.sprite('logs', { x: 2, y: 22 });
    if (level === 0) body += `<g class="smoke">${PX.sprite(['..s.', '.sss', 's.s.', '.s..'], { x: 10, y: 14 })}</g>`;
    if (level === 1) body += PX.sprite('spark', { x: 10, y: 19 });
    if (level === 2) body += PX.sprite('flame', { x: 6, y: 9 });
    if (level >= 3) body += PX.sprite('fire1', { x: 4, y: 6, cls: 'fr f1' }) + PX.sprite('fire2', { x: 4, y: 6, cls: 'fr f2' }) + PX.sprite('fire3', { x: 4, y: 6, cls: 'fr f3' });
    if (level >= 5) body += PX.sprite('spark', { x: 2, y: 3 }) + PX.sprite('spark', { x: 19, y: 1 });
    if (level >= 6) body += PX.sprite('spark', { x: 11, y: 0 });
    const w = 24 * unit * (0.5 + level / 6 * 0.5);
    return `<svg viewBox="0 0 24 28" width="${Math.round(w / 4) * 4}" class="pixelart" shape-rendering="crispEdges" aria-hidden="true">${body}</svg>`;
  }
  function meterHtml(level, unit, withInfo) {
    const segs = Array.from({ length: 6 }, (_, i) => `<i class="${i < level ? 'on' : ''}"></i>`).join('');
    return fireSvg(level, unit) + (withInfo ? `<div class="info"><span class="px-label">Fire strength</span><span class="lvl">${level} / 6 · ${LEVELS[level]}</span><div class="segs" aria-hidden="true">${segs}</div></div>` : '');
  }

  /* ── Prompt assembly ─────────────────────────────────────────────────────── */
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  function promptParts(on, sep) {
    sep = sep || '\n\n';
    const t = TASKS[st.task];
    const parts = PARTS.filter(([k]) => on.has(k));
    if (!parts.length) return { text: t.weak, html: `<span class="weak">${esc(t.weak)}</span>` };
    return {
      text: parts.map(([k, l]) => `${l}: ${t[k]}`).join(sep),
      html: parts.map(([k, l]) => `<span class="k">${esc(l)}:</span> ${esc(t[k])}`).join(sep),
    };
  }
  const narrow = () => window.matchMedia('(max-width: 760px)').matches;
  const big = () => window.matchMedia('(min-width: 1024px) and (min-height: 600px)').matches;
  const sizeKey = () => (narrow() ? 'n' : big() ? 'b' : 'm');

  function renderBuild() {
    const t = TASKS[st.task];
    $('blocks').innerHTML = PARTS.map(([k, l]) => `<button type="button" class="block" data-k="${k}" aria-pressed="${st.on.has(k)}"><b>${esc(l)}</b><span>${esc(t[k])}</span></button>`).join('');
    const p = promptParts(st.on);
    $('preview').innerHTML = p.html;
    const n = st.on.size;
    $('preview').style.setProperty('--n', String(n));
    $('prompt-label').textContent = n ? `Your prompt: ${n} of 6 parts, ${p.text.split(/\s+/).length} words` : 'Your prompt: the weak one-liner. Add parts.';
    $('meter').innerHTML = meterHtml(n, narrow() ? 2 : big() ? 8 : 6, true);
  }
  function renderCompare() {
    const t = TASKS[st.task];
    const unit = narrow() ? 2 : big() ? 5 : 4;
    $('m-weak').innerHTML = meterHtml(0, unit, false);
    $('m-strong').innerHTML = meterHtml(6, unit, false);
    $('p-weak').innerHTML = promptParts(new Set()).html;
    $('p-strong').innerHTML = promptParts(new Set(PARTS.map((x) => x[0])), '\n').html;
    $('l-weak').innerHTML = `<b>What you’ll probably get:</b> ${esc(t.weakResult)}`;
    $('l-strong').innerHTML = `<b>What you’ll probably get:</b> ${esc(t.strongResult)}`;
  }
  function render() {
    const cmp = st.view === 'compare';
    $('build-left').hidden = cmp; $('build-right').hidden = cmp; $('cmp').hidden = !cmp;
    document.querySelectorAll('[data-task]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.task === st.task)));
    document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === st.view)));
    if (cmp) renderCompare(); else renderBuild();
  }

  $('blocks').addEventListener('click', (e) => {
    const b = e.target.closest('.block');
    if (!b) return;
    const k = b.dataset.k;
    if (st.on.has(k)) st.on.delete(k); else st.on.add(k);
    $('status').textContent = '';
    render();
    const again = $('blocks').querySelector(`[data-k="${k}"]`);
    if (again) again.focus();
  });
  document.querySelectorAll('[data-task]').forEach((b) => b.addEventListener('click', () => { st.task = b.dataset.task; $('status').textContent = ''; render(); }));
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { st.view = b.dataset.view; render(); }));

  /* ── Copy: clipboard API, else select the text so Ctrl+C works ───────────── */
  function selectPreview() {
    const range = document.createRange();
    range.selectNodeContents($('preview'));
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  }
  $('copy').addEventListener('click', async () => {
    const text = promptParts(st.on).text;
    let ok = false;
    // In a sandboxed tool card the Clipboard API is blocked by policy; ask first so the browser logs no violation
    const policy = document.permissionsPolicy || document.featurePolicy;
    let allowed = true;
    try { allowed = !policy || !policy.allowsFeature || policy.allowsFeature('clipboard-write'); } catch (e) { allowed = true; }
    try {
      if (allowed && navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; }
    } catch (e) { ok = false; }
    if (!ok) {
      try { selectPreview(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
    }
    if (ok) $('status').textContent = 'Copied. Paste it into your AI chat.';
    else { selectPreview(); $('status').textContent = 'Text selected. Press Ctrl+C (Cmd+C on a Mac) to copy.'; }
  });

  let lastNarrow = sizeKey();
  window.addEventListener('resize', () => { if (sizeKey() !== lastNarrow) { lastNarrow = sizeKey(); render(); } });
  render();
})();
</script>
</body>
</html>
