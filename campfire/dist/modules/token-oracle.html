:root {
  color-scheme: dark;
  /* Night: the LCD greens of pix·el, darkened for a campfire evening */
  --night-0: #050a05;
  --night-1: #0c170b;
  --night-2: #12210f;
  --night-3: #1b2d17;
  --night-4: #2a4123;
  --lcd-a: #306230;
  --lcd-b: #4c7420;
  --lcd-c: #7a9a1c;
  --lcd-d: #a9c431;
  --lcd-e: #d4ef78;
  --lcd-f: #e3efa8;
  /* Fire: the only warm colours (pixletics flame + pix·el LED) */
  --fire-0: #e8483f;
  --fire-1: #ff5a36;
  --fire-2: #ffae00;
  --fire-3: #ffe06a;
  --fire-4: #fff6c8;
  --wood-0: #3a2414;
  --wood-1: #6b4226;
  --wood-2: #9a6a3c;
  /* Text and lines */
  --ink: #e2f0c6;
  --muted: #9fb48f;
  --line: #2a4123;
  --marker: #ffe45e;
  --bg: var(--night-1);
  --card: var(--night-2);

  --pixel: "Jersey 10", "Courier New", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;

  --px: 4px;            /* one art pixel on screen (scenes scale in whole multiples) */
  --step: 125ms;        /* one animation frame = 8 fps */
  --gutter: max(16px, 4vw);
  --radius: 0;          /* pixel world: no rounded corners */
}

/* Light variant for projectors that wash out dark slides: add data-theme="light" on <html> */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7ef;
  --card: #ffffff;
  --ink: #12280f;
  --muted: #56654f;
  --line: #d3dcc4;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 18px/1.55 var(--sans);
}

/* Headlines and labels in the pixel font — big, never for long sentences */
.px-title { font-family: var(--pixel); font-weight: 400; letter-spacing: 0.02em; line-height: 0.95; }
.px-label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

/* Pixel art: crisp at every scale */
.pixelart, .pixelart svg, svg.pixelart { image-rendering: pixelated; shape-rendering: crispEdges; }

/* Pixel frame: a 1-art-pixel border with cut corners, like an old handheld UI */
.px-frame {
  background: var(--card);
  border: var(--px) solid var(--night-4);
  box-shadow: 0 0 0 var(--px) var(--night-0), var(--px) var(--px) 0 var(--px) var(--night-0);
}

/* Buttons that feel like hardware keys */
.px-btn {
  font: 20px/1 var(--pixel);
  color: var(--night-0);
  background: var(--lcd-d);
  border: 0;
  padding: 12px 18px;
  min-height: 44px;
  cursor: pointer;
  box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--lcd-b), 0 var(--px) 0 var(--night-0);
}
.px-btn:hover { background: var(--lcd-e); }
.px-btn:active { transform: translateY(var(--px)); box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--lcd-b); }
.px-btn.fire { background: var(--fire-2); box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--fire-1), 0 var(--px) 0 var(--night-0); }
.px-btn.fire:hover { background: var(--fire-3); }

:focus-visible { outline: 3px solid var(--marker); outline-offset: 3px; }

/* Flicker helpers for HTML (SVG scenes carry their own copy of these keyframes) */
@keyframes px-flicker { 0% { opacity: 1; } 50% { opacity: 0.82; } 100% { opacity: 1; } }
@keyframes px-frames-3 { from { transform: translateX(0); } to { transform: translateX(-300%); } }
@keyframes px-blink { 0%, 92% { opacity: 1; } 93%, 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  /* ── Rendering ───────────────────────────────────────────────────────────── */

  function check(name, rows) {
    const w = rows[0].length;
    rows.forEach((r, i) => { if (r.length !== w) throw new Error(`PX: sprite "${name}" row ${i} has ${r.length} px, expected ${w}`); });
    return w;
  }

  /** Path data for every pixel equal to `ch` (runs merged), offset by ox/oy */
  function runPath(rows, ch, ox, oy) {
    let d = '';
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] !== ch) continue;
        let n = 1;
        while (row[x + n] === ch) n++;
        d += `M${ox + x} ${oy + y}h${n}v1h-${n}z`;
        x += n - 1;
      }
    });
    return d;
  }

  /** Sprite → '<path fill=… d=…/>' per colour. opts: { x, y, pal (overrides), cls } */
  function sprite(nameOrRows, opts) {
    const o = opts || {};
    const rows = typeof nameOrRows === 'string' ? SPRITES[nameOrRows] : nameOrRows;
    if (!rows) throw new Error(`PX: unknown sprite "${nameOrRows}"`);
    check(String(nameOrRows), rows);
    const pal = Object.assign({}, PAL, o.pal || {});
    const chars = [...new Set(rows.join(''))].filter((c) => c !== '.');
    const cls = o.cls ? ` class="${o.cls}"` : '';
    return `<g${cls}>${chars.map((c) => `<path fill="${pal[c] || c}" d="${runPath(rows, c, o.x || 0, o.y || 0)}"/>`).join('')}</g>`;
  }

  /** Icon → one path (fill = currentColor unless given) */
  function icon(name, opts) {
    const o = opts || {};
    const rows = ICONS[name];
    if (!rows) throw new Error(`PX: unknown icon "${name}"`);
    check(name, rows);
    return `<path fill="${o.fill || 'currentColor'}" d="${runPath(rows, '#', o.x || 0, o.y || 0)}"/>`;
  }

    const desc = o.desc ? `<desc>${o.desc}</desc>` : '';
    const style = o.css ? `<style>${o.css}</style>` : '';
    const bg = o.bg ? `<rect width="${o.w}" height="${o.h}" fill="${o.bg}"/>` : '';
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${o.w} ${o.h}" width="${o.w * (o.scale || 1)}" height="${o.h * (o.scale || 1)}" shape-rendering="crispEdges" role="img">${title}${desc}${style}${bg}${o.body}</svg>`;

  /** Width of one line (or the widest line) in px at the given scale (default 1) */
  function textWidth(str, scale) {
    const s = scale || 1;
    return Math.max(...String(str).split('\n').map((line) => {
      const w = [...line].reduce((a, ch) => a + glyph(ch)[0].length + 1, 0);
      return Math.max(0, w - 1) * s;
    }));
  }

  /** Text → one '<path>' of merged pixel runs. opts: { x, y (top edge), fill, scale, align: 'left'|'center'|'right' }.
      '\n' starts a new line (9 px line height × scale). Default fill = PAL.i (ink on night). */
  function text(str, opts) {
    const o = opts || {};
    const s = o.scale || 1;
    let d = '';
    String(str).split('\n').forEach((line, li) => {
      const lw = textWidth(line, s);
      let cx = (o.x || 0) - (o.align === 'center' ? Math.floor(lw / 2) : o.align === 'right' ? lw : 0);
      const cy = (o.y || 0) + li * LINE_H * s;
      for (const ch of line) {
        const rows = glyph(ch);
        rows.forEach((row, ry) => {
          for (let x = 0; x < row.length; x++) {
            if (row[x] !== '#') continue;
            let n = 1;
            while (row[x + n] === '#') n++;
            d += `M${cx + x * s} ${cy + ry * s}h${n * s}v${s}h-${n * s}z`;
            x += n - 1;
          }
        });
        cx += (rows[0].length + 1) * s;
      }
    });
    return `<path fill="${o.fill || PAL.i}" d="${d}"/>`;
  }

<body>
<header class="top">
  <h1 class="px-title">Token Oracle</h1>
  <p><b>It predicts the next word.</b> <span class="more">It doesn't know things, it continues text it has read.</span></p>
</header>

<main>
  <section class="panel px-frame write" aria-label="Write">
    <label class="px-label" for="sentence">Start of a sentence</label>
    <input id="sentence" type="text" autocomplete="off" spellcheck="false" value="The client">
    <div class="row">
      <button class="px-btn fire" id="next" type="button">Continue</button>
      <button class="px-btn" id="auto" type="button" aria-pressed="false">Auto · 12 words</button>
      <button class="px-btn" id="clear" type="button">Clear</button>
    </div>
    <div class="row" id="starters" aria-label="Sentence starters"></div>
  </section>

  <section class="panel px-frame bars" aria-labelledby="bars-h">
    <h2 class="px-label" id="bars-h" style="margin:0">Next word: top candidates</h2>
    <p class="ctx" id="ctx"></p>
    <ol class="cands" id="cands"></ol>
    <p class="note" id="note" hidden><svg viewBox="0 0 16 16" class="pixelart" aria-hidden="true"></svg><span>Never saw this, guessing from what's common.</span></p>
  </section>

  <section class="panel px-frame temp" aria-label="Temperature">
    <div class="temp-head">
      <label class="px-label" for="t">Temperature</label>
      <output id="tout" for="t">0.7</output>
    </div>
    <input id="t" type="range" min="0.1" max="2" step="0.1" value="0.7">
    <p class="mood" id="mood"></p>
    <div class="stage pixelart" aria-hidden="true"><svg id="fire" viewBox="0 0 24 26" shape-rendering="crispEdges"></svg></div>
  </section>
</main>
<p class="sr" id="live" aria-live="polite"></p>
<script>
(function () {
  'use strict';
  /* ── Corpus: about 4 KB of short sentences the oracle has "read" ─────────── */
  const CORPUS = `the client wants a bold idea for the new exhibition.
the client loves the prototype and asks for one more version.
the client wants the logo bigger and the budget smaller.
the client asks for a quick sketch before friday.
the client signs off the design after the second round.
the client visits the studio to see the model.
the studio builds a prototype in two days.
the studio sketches the exhibition on a big wall.
the studio team books the 3d printer for the model.
the studio smells of coffee and fresh paint.
the prototype is ugly but it works.
the prototype shows the idea better than any slide.
the prototype breaks when the client clicks too fast.
the prototype gets better with every round of feedback.
the exhibition opens in spring with a big light installation.
the exhibition needs a clear story and a simple path.
the exhibition tells the story of the brand in three rooms.
visitors walk through the exhibition and touch everything.
visitors love the interactive wall more than the text panels.
around the campfire we tell stories about old projects.
around the campfire the team shares ideas and marshmallows.
the fire keeps us warm and gives us light.
the fire needs wood and someone who watches it.
the fire burns low when nobody feeds it.
the fire grows when we add dry wood.
a good fire needs air, wood and patience.
a good prompt needs a goal, context and a clear finish line.
a good design starts with a good question.
a good prototype answers one question at a time.
the ai predicts the next word from what it has read.
the ai writes code when we describe the result.
the ai sounds confident even when it is wrong.
the ai only sees what is inside the context window.
the ai forgets the chat but the files remember.
the ai is a very well read autocomplete.
we describe the result and the ai builds a first version.
we look at the result and give feedback with screenshots.
we test the tool before we send the link to the client.
we keep the rules in a file so the ai remembers them.
designers are good at feedback because they have taste.
designers sketch, test and sketch again.
the designer picks a colour and the ai follows the brand.
the brand colour is violet and the accent is lime.
the team votes on the best idea with three dots each.
the team builds small tools for time, budgets and quotes.
the team ships small and reviews always.
every tool needs an owner and a short readme.
every prototype starts as one html file.
every exhibition starts with a story.
one html file works offline on any laptop.
one small step at a time keeps the fire burning.
the model guesses the next word and then the next.
the model has no idea what it does not see.
the next word is a guess with a probability.
a high temperature makes the fire wild and the words strange.
a low temperature makes the answer safe and boring.
the workshop starts at nine with coffee and a sketch.
the deadline is close but the idea is good.
the light installation glows in violet and green.
the model of the stand comes out of the 3d printer.
the 3d printer runs all night for the exhibition model.
we build the stand in the hall two days before the opening.
the opening night is loud, bright and full of people.
the story is more important than the software.
humans decide and the ai proposes.
the smoke tells us when something burns.
nobody wants a tool that nobody maintains.
the sketch becomes a prototype and the prototype becomes a tool.`;

  const S = '<s>', END = '.';
  const DISPLAY = { ai: 'AI', '3d': '3D', html: 'HTML', i: 'I', '.': '. (end)' };
  const tokenize = (text) => text.toLowerCase().replace(/[’]/g, "'").replace(/[^a-z0-9'.\s]/g, ' ')
    .replace(/\./g, ' . ').split(/\s+/).filter(Boolean);

  /* ── Model: unigram, bigram and trigram counts ───────────────────────────── */
  const uni = new Map(), bi = new Map(), tri = new Map();
  const inc = (m, k, w) => { let x = m.get(k); if (!x) { x = new Map(); m.set(k, x); } x.set(w, (x.get(w) || 0) + 1); };
  CORPUS.split('\n').forEach((line) => {
    const t = [S, S, ...tokenize(line)];
    for (let i = 2; i < t.length; i++) {
      if (t[i] !== END) uni.set(t[i], (uni.get(t[i]) || 0) + 1);
      inc(bi, t[i - 1], t[i]);
      inc(tri, t[i - 2] + ' ' + t[i - 1], t[i]);
    }
  });
  const total = (m) => { let s = 0; for (const c of m.values()) s += c; return s; };

  function context(text) {
    const t = tokenize(text);
    const lastDot = t.lastIndexOf(END);
    const c = [S, S, ...t.slice(lastDot + 1)];
    return [c[c.length - 2], c[c.length - 1]];
  }

  /** Interpolated scores, then softmax(log(score) / T) */
  function predict(text, T) {
    const [a, b] = context(text);
    const t3 = tri.get(a + ' ' + b), t2 = bi.get(b);
    const mode = t3 ? 'tri' : t2 ? 'bi' : 'uni';
    const score = new Map();
    const add = (m, wt) => { if (!m) return; const n = total(m); for (const [k, c] of m) score.set(k, (score.get(k) || 0) + wt * c / n); };
    if (mode === 'tri') { add(t3, 0.72); add(t2, 0.23); add(uni, 0.05); }
    else if (mode === 'bi') { add(t2, 0.85); add(uni, 0.15); }
    else add(uni, 1);
    const logits = [...score].map(([w, s]) => [w, Math.log(s) / T]);
    const max = Math.max(...logits.map((x) => x[1]));
    let z = 0; const probs = logits.map(([w, l]) => { const e = Math.exp(l - max); z += e; return [w, e]; });
    probs.forEach((p) => { p[1] /= z; });
    probs.sort((x, y) => y[1] - x[1]);
    const seen = mode === 'tri' ? total(t3) : mode === 'bi' ? total(t2) : 0;
    return { a, b, mode, seen, probs };
  }

  function sample(probs) {
    let r = Math.random();
    for (const [w, p] of probs) { r -= p; if (r <= 0) return w; }
    return probs[0][0];
  }

  /* ── UI ──────────────────────────────────────────────────────────────────── */
  const $ = (id) => document.getElementById(id);
  const input = $('sentence'), slider = $('t'), cands = $('cands');
  const show = (w) => DISPLAY[w] || w;
  const shown = (w) => (w === S ? 'start of a sentence' : show(w));

  const STARTERS = ['The client', 'The AI', 'Around the campfire', 'A good prompt', 'The prototype', 'The exhibition', 'My cat'];
  STARTERS.forEach((s) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (s === 'My cat' ? ' odd' : ''); b.textContent = s + ' …';
    b.addEventListener('click', () => { stopAuto(); input.value = s; render(); });
    $('starters').appendChild(b);
  });
  document.querySelector('#note svg').innerHTML = PX.icon('ember', { fill: 'var(--marker)' });

  const T = () => Math.round(parseFloat(slider.value) * 10) / 10;

  function render() {
    const temp = T();
    const res = predict(input.value, temp);
    const top = res.probs.slice(0, 8);
    cands.innerHTML = top.map(([w, p], i) => {
      const pct = p * 100;
      const label = pct < 1 ? '<1%' : Math.round(pct) + '%';
      const width = Math.max(0, Math.round(pct / 2) * 2);
      return `<li class="cand"><span class="w">${show(w)}</span><span class="track" aria-hidden="true"><span class="bar" style="width:${width}%"></span></span><span class="pct">${label}</span></li>`;
    }).join('');
    const ctx = res.a === S ? [res.b] : [res.a, res.b];
    const ctxText = ctx.map(shown).join(' ');
    let how;
    if (res.mode === 'tri') how = `seen this pair ${res.seen}× in its reading`;
    else if (res.mode === 'bi') how = `never saw the pair, but saw “${show(res.b)}” ${res.seen}×`;
    else how = 'never saw this word';
    $('ctx').innerHTML = `Looking at <q>${escapeHtml(ctxText)}</q>: ${how}.`;
    $('note').hidden = res.mode !== 'uni';
    $('live').textContent = 'Top guess: ' + show(top[0][0]) + ', ' + Math.round(top[0][1] * 100) + ' percent.';
    return res;
  }

  function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function append(word) {
    let v = input.value.replace(/\s+$/, '');
    const atStart = !v || /\.$/.test(v);
    if (word === END) { input.value = v + '.'; return; }
    let w = show(word);
    if (atStart) w = w.charAt(0).toUpperCase() + w.slice(1);
    input.value = v + (v ? ' ' : '') + w;
  }

  function step() {
    const res = predict(input.value, T());
    append(sample(res.probs));
    render();
    input.scrollLeft = input.scrollWidth;
  }

  /* Auto: 12 words, one per beat */
  let autoTimer = null, autoLeft = 0;
  function stopAuto() {
    clearTimeout(autoTimer); autoTimer = null;
    $('auto').setAttribute('aria-pressed', 'false'); $('auto').textContent = 'Auto · 12 words';
  }
  function tick() {
    if (autoLeft-- <= 0) { stopAuto(); return; }
    step();
    $('auto').textContent = 'Stop · ' + autoLeft + ' left';
    autoTimer = setTimeout(tick, 420);
  }
  $('auto').addEventListener('click', () => {
    if (autoTimer) { stopAuto(); return; }
    autoLeft = 12; $('auto').setAttribute('aria-pressed', 'true'); tick();
  });
  $('next').addEventListener('click', () => { stopAuto(); step(); });
  $('clear').addEventListener('click', () => { stopAuto(); input.value = ''; render(); input.focus(); });
  input.addEventListener('input', () => { stopAuto(); render(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); stopAuto(); step(); } });

  /* ── Fire that follows the temperature ───────────────────────────────────── */
  const fire = $('fire');
  fire.innerHTML =
    PX.sprite('spark', { x: 3, y: 6, cls: 'spk' }) + PX.sprite('spark', { x: 18, y: 3, cls: 'spk s2' }) + PX.sprite('spark', { x: 11, y: 0, cls: 'spk s3' }) +
    PX.sprite('fire1', { x: 4, y: 4, cls: 'fr f1' }) + PX.sprite('fire2', { x: 4, y: 4, cls: 'fr f2' }) + PX.sprite('fire3', { x: 4, y: 4, cls: 'fr f3' }) +
    PX.sprite('logs', { x: 2, y: 20 });
  const sparks = fire.querySelectorAll('.spk');

  function onTemp() {
    const t = T();
    $('tout').textContent = t.toFixed(1);
    const stage = fire.parentNode;
    stage.style.setProperty('--fs', String(Math.max(1, Math.round(1 + t * 2.5))));
    stage.style.setProperty('--step', Math.round(190 - t * 60) + 'ms');
    sparks.forEach((s, i) => { s.style.display = t >= 0.9 + i * 0.35 ? '' : 'none'; });
    $('mood').textContent = t < 0.45 ? 'Careful: almost always picks the safest word.'
      : t <= 1.1 ? 'Balanced: mostly sensible, sometimes surprising.'
      : 'Wild: rare words get a real chance. Creative, often nonsense.';
    render();
  }
  slider.addEventListener('input', onTemp);
  onTemp();
})();
</script>
</body>
</html>
