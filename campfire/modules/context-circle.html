<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Circle · Campfire</title>
<link rel="stylesheet" href="../shared/campfire.css">
<script src="../shared/pixel.js"></script>
<style>
  html, body { min-height: 100%; }
  body {
    font-size: clamp(14px, 0.5vw + 10px, 19px);
    padding: clamp(10px, 1.6vw, 24px);
    display: flex; flex-direction: column; gap: clamp(8px, 1.2vw, 14px);
    min-height: 100vh;
  }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 18px; }
  .top h1 { margin: 0; font-size: clamp(32px, 4.4vw, 64px); color: var(--fire-3); }
  .top p { margin: 0; color: var(--muted); }
  .top b { color: var(--ink); font-weight: 600; }

  main { flex: 1; min-height: 0; display: grid; gap: clamp(10px, 1.4vw, 18px); grid-template-columns: minmax(0, 1fr) clamp(260px, 27vw, 380px); grid-template-rows: minmax(0, 1fr); }

  /* Stage: night, a pixel pool of light, the chat and the fire */
  .stage { position: relative; overflow: hidden; background: var(--night-0); border: var(--px) solid var(--night-3); display: flex; flex-direction: column; min-height: 260px; }
  .stage svg.pool { position: absolute; left: 0; top: 0; pointer-events: none; }
  .chat { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 10px 12px 4px; width: 100%; max-width: 680px; margin: 0 auto; overflow: hidden; }
  .msg { position: relative; max-width: 84%; padding: 5px 10px 6px; font-size: 0.88em; line-height: 1.35; border: 2px solid transparent; transition: background-color calc(var(--step) * 2) steps(2, end), color calc(var(--step) * 2) steps(2, end); }
  .msg.you { margin-left: auto; }
  .msg .who { font: 1.05em/1 var(--pixel); margin-right: 6px; }
  .msg .tok { float: right; margin: 1px 0 0 10px; font: 0.8em/1.3 var(--mono); }
  .msg.lit { background: var(--fire-4); color: #1d1408; border-color: var(--fire-2); }
  .msg.lit .tok { color: #5a4020; }
  .msg.lit.ai { background: var(--lcd-f); border-color: var(--lcd-c); }
  .msg.dark { background: transparent; color: #8fa382; border: 2px dashed var(--night-4); }
  .msg.dark .tok { color: #8fa382; }
  .msg .fact { display: inline-block; font: 0.95em/1 var(--pixel); padding: 2px 4px; margin-right: 6px; background: #6a3fd0; color: #fff; }
  .msg.dark .fact { background: transparent; color: #b69cff; border: 2px solid #6a3fd0; }
  .msg.enter { animation: cc-enter calc(var(--step) * 3) steps(3, end); }
  @keyframes cc-enter { from { transform: translateY(18px); opacity: 0.3; } to { transform: translateY(0); opacity: 1; } }
  .msg.answer { background: var(--night-2); color: var(--ink); border: 2px solid var(--marker); max-width: 92%; }
  .msg.answer.wrong { border-color: #ff8a70; }
  .msg.answer .why { display: block; margin-top: 4px; color: var(--marker); font-size: 0.9em; }
  .msg.answer.wrong .why { color: #ffb4a3; }
  .hint { margin: auto; color: var(--muted); text-align: center; }

  .hearth { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 12px; padding: 2px 10px 8px; }
  .hearth svg.fire { width: 72px; height: auto; display: block; }
  .pin { font-size: 0.8em; line-height: 1.3; padding: 4px 8px; background: #2b1f4d; color: #efe8ff; border: 2px solid #9d7bff; max-width: 46%; }
  .pin b { font: 1.15em/1 var(--pixel); font-weight: 400; display: block; color: #d9ccff; }

  /* Side panel */
  .side { padding: clamp(10px, 1.2vw, 16px); display: flex; flex-direction: column; gap: 10px; min-width: 0; overflow: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .px-btn:disabled, .px-btn:disabled:hover { background: var(--night-3); color: var(--muted); box-shadow: none; cursor: not-allowed; transform: none; }
  .knob { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .knob output { font: 1.6em/1 var(--pixel); color: var(--fire-3); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; cursor: pointer; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; background: var(--night-4); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 32px; margin-top: -12px; background: var(--fire-2); border: 0; box-shadow: inset 0 -4px 0 var(--fire-1); }
  input[type=range]::-moz-range-track { height: 8px; background: var(--night-4); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 32px; background: var(--fire-2); border: 0; border-radius: 0; }
  input[type=range]:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }

  .switch { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-weight: 600; line-height: 1.25; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .box { flex: none; width: 48px; height: 28px; background: var(--night-3); border: var(--px) solid var(--night-4); position: relative; }
  .switch .box::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: var(--muted); }
  .switch input:checked + .box { background: #6a3fd0; border-color: #9d7bff; }
  .switch input:checked + .box::after { left: 22px; background: #efe8ff; }
  .switch input:focus-visible + .box { outline: 3px solid var(--marker); outline-offset: 3px; }

  .stats { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 0.9em; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-weight: 600; text-align: right; }
  .gauge { display: flex; gap: 2px; height: 14px; }
  .gauge i { flex: 1; background: var(--night-3); }
  .gauge i.on { background: var(--fire-2); }
  .gauge i.pin { background: #9d7bff; }
  .lesson { margin: 0; padding: 8px 10px; background: var(--night-1); border-left: var(--px) solid var(--fire-2); font-size: 0.9em; }

  .glow { animation: cc-glow calc(var(--step) * 4) steps(1, end) infinite; }
  @keyframes cc-glow { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.88; } }
  .fr { opacity: 0; animation: cc-frames calc(var(--step) * 3) steps(1, end) infinite; }
  .fr.f1 { opacity: 1; }
  .fr.f2 { animation-delay: calc(var(--step) * -2); }
  .fr.f3 { animation-delay: calc(var(--step) * -1); }
  @keyframes cc-frames { 0% { opacity: 1; } 33.333% { opacity: 0; } 100% { opacity: 0; } }

  @media (min-width: 761px) and (min-height: 560px) { body { height: 100vh; } }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto auto; }
    .top h1 { font-size: 34px; }
    .top .more { display: none; }
    .stage { height: 300px; min-height: 0; }
    .hearth svg.fire { width: 48px; }
    .msg { font-size: 0.82em; max-width: 90%; }
  }
  @media (prefers-reduced-motion: reduce) { .glow, .fr, .msg.enter { animation: none !important; } .msg { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1 class="px-title">Context Circle</h1>
  <p><b>It only sees what's inside the circle of light.</b> <span class="more">Everything in the dark doesn't exist for it.</span></p>
</header>

<main>
  <section class="stage" id="stage" aria-label="The chat around the fire">
    <svg class="pool pixelart" id="pool" shape-rendering="crispEdges" aria-hidden="true"></svg>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="hearth" id="hearth">
      <div class="pin" id="pin" hidden><b>CLAUDE.md · pinned</b>Client: coffee roaster. Logo colour: violet. <span class="tok">14 tok</span></div>
      <svg class="fire pixelart" id="fire" viewBox="0 0 20 22" shape-rendering="crispEdges" aria-hidden="true"></svg>
    </div>
  </section>

  <section class="side px-frame" aria-label="Controls">
    <div class="row">
      <button class="px-btn fire" id="next" type="button">Next</button>
      <button class="px-btn" id="play" type="button">Play</button>
      <button class="px-btn" id="reset" type="button">Reset</button>
    </div>
    <div>
      <div class="knob"><label class="px-label" for="cap">Context window</label><output id="capout" for="cap">120 tokens</output></div>
      <input type="range" id="cap" min="40" max="260" step="10" value="120">
    </div>
    <label class="switch"><input type="checkbox" id="pinbox"><span class="box" aria-hidden="true"></span><span>Pin memory file (CLAUDE.md)</span></label>
    <div class="gauge" id="gauge" aria-hidden="true"></div>
    <dl class="stats" id="stats"></dl>
    <p class="lesson" id="lesson"></p>
  </section>
</main>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const CHAT = [
    ['you', 'We’re designing a trade-fair stand for a coffee roaster. Can you help me plan it?'],
    ['ai', 'Happy to. What do we know about the brand so far?'],
    ['you', 'The client’s logo colour is violet. Everything should match it.', 'fact'],
    ['ai', 'Noted, violet it is. How big is the stand?'],
    ['you', 'Six by four metres, open on two sides, with a coffee bar in one corner.'],
    ['ai', 'Then the bar can anchor the corner and pull people in from the aisle.'],
    ['you', 'We also need a wall for the product story, about four metres long.'],
    ['ai', 'A story wall on the long side, in three chapters: bean, roast, cup.'],
    ['you', 'Lighting should feel warm, like a café in the evening.'],
    ['ai', 'Warm white spots on the wall and a glowing front for the bar.'],
    ['you', 'Budget is tight, so we reuse the modular frames from last year.'],
    ['ai', 'Good call. Reused frames also save build time on site.'],
    ['you', 'Now the print files. What colour was the logo?'],
  ];
  const tokens = (s) => Math.ceil(s.length / 4); // rule of thumb: about 4 characters per token
  const MSGS = CHAT.map(([who, text, kind], i) => ({ i, who, text, kind, tok: tokens(text) }));
  const PIN_TOK = 14;
  const LAST = MSGS.length + 1; // one extra step: the answer

  const st = { step: 1, pinned: false, cap: 120, entered: 0 };

  function compute() {
    const shown = MSGS.slice(0, Math.min(st.step, MSGS.length));
    const room = st.cap - (st.pinned ? PIN_TOK : 0);
    let used = 0; const lit = new Set();
    for (let k = shown.length - 1; k >= 0; k--) {
      const m = shown[k];
      if (used + m.tok > room && lit.size) break;
      used += m.tok; lit.add(m.i);
    }
    const factLit = lit.has(2);
    const darkTok = shown.filter((m) => !lit.has(m.i)).reduce((s, m) => s + m.tok, 0);
    return { shown, lit, used, room, factLit, darkTok, darkN: shown.length - lit.size };
  }

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function render() {
    const r = compute();
    const chat = $('chat');
    let html = r.shown.map((m) => {
      const on = r.lit.has(m.i);
      const cls = ['msg', m.who, on ? 'lit' : 'dark', m.i >= st.entered ? 'enter' : ''].join(' ');
      const fact = m.kind === 'fact' ? '<span class="fact">KEY FACT</span>' : '';
      const where = on ? '' : '<span class="sr" style="position:absolute;left:-9999px">(in the dark) </span>';
      return `<div class="${cls}" data-i="${m.i}">${where}<span class="tok">${m.tok} tok</span>${fact}<span class="who">${m.who === 'you' ? 'You' : 'AI'}</span>${esc(m.text)}</div>`;
    }).join('');
    if (st.step >= LAST) {
      const right = r.factLit || st.pinned;
      const text = right ? (r.factLit ? 'The logo is violet, as you said at the start. I’ll set the print files to violet.'
        : 'The logo is violet: it’s in CLAUDE.md. I’ll set the print files to violet.')
        : 'Probably a warm coffee brown? That would suit a coffee roaster. I’ll set the print files to brown.';
      const why = right ? (r.factLit ? 'Correct: the fact was still in the light.' : 'Correct: the pinned memory file kept the fact in the light.')
        : 'Plausible, confident and wrong. The fact had walked into the dark.';
      html += `<div class="msg ai answer${right ? '' : ' wrong'}${st.entered <= MSGS.length ? ' enter' : ''}"><span class="who">AI</span>${esc(text)}<span class="why">${why}</span></div>`;
    }
    if (!r.shown.length) html = '<p class="hint">Press Next: the first message walks up to the fire.</p>';
    chat.innerHTML = html;
    st.entered = st.step;
    $('pin').hidden = !st.pinned;

    // side panel
    const cells = 26, per = st.cap / cells;
    const pinCells = st.pinned ? Math.round(PIN_TOK / per) : 0, onCells = Math.min(cells - pinCells, Math.round(r.used / per));
    $('gauge').innerHTML = Array.from({ length: cells }, (_, k) => `<i class="${k < pinCells ? 'pin' : k < pinCells + onCells ? 'on' : ''}"></i>`).join('');
    const inLight = r.used + (st.pinned ? PIN_TOK : 0);
    $('stats').innerHTML =
      `<dt>In the light</dt><dd>${inLight} / ${st.cap} tokens</dd>` +
      `<dt>In the dark</dt><dd>${r.darkN} message${r.darkN === 1 ? '' : 's'}, ${r.darkTok} tokens</dd>` +
      `<dt>Key fact</dt><dd>${st.step < 3 ? 'not said yet' : st.pinned ? 'pinned in CLAUDE.md' : r.factLit ? 'in the light' : 'in the dark'}</dd>`;
    $('lesson').textContent = st.step >= LAST
      ? (r.factLit || st.pinned ? 'Shrink the circle or unpin the file and ask again: the answer changes.' : 'Widen the context window, or pin the memory file. Then ask again.')
      : st.pinned ? 'Pinned files stay in the light, whatever the chat does. That’s why projects keep their memory in files.'
      : 'Long chats push old messages into the dark. The model can’t see them any more.';
    $('next').disabled = st.step >= LAST;
    $('next').textContent = st.step === MSGS.length ? 'Answer' : 'Next';
    $('play').textContent = playTimer ? 'Pause' : 'Play';
    requestAnimationFrame(drawPool);
  }

  /* ── Pixel pool of light from the fire up to the oldest lit message ─────── */
  const CELL = 8;
  function drawPool() {
    const stage = $('stage'), pool = $('pool');
    const W = stage.clientWidth, H = stage.clientHeight;
    const lit = stage.querySelectorAll('.msg.lit, .msg.answer');
    const sTop = stage.getBoundingClientRect().top;
    let top = $('hearth').getBoundingClientRect().top - sTop - 24;
    if (lit.length) top = Math.min(top, lit[0].getBoundingClientRect().top - sTop - 14);
    top = Math.max(0, top);
    const cols = Math.ceil(W / CELL), rows = Math.ceil(H / CELL);
    const cx = W / 2, cy = H - 20, ry = Math.max(40, cy - top);
    const chatW = $('chat').clientWidth;
    const rx = Math.min(W / 2 + 40, Math.max(ry * 1.15, chatW / 2 + 36));
    const grid = [];
    for (let y = 0; y < rows; y++) {
      let row = '';
      for (let x = 0; x < cols; x++) {
        const dx = (x * CELL + CELL / 2 - cx) / rx, dy = (y * CELL + CELL / 2 - cy) / ry;
        const d = dx * dx + dy * dy;
        row += d < 0.42 ? '3' : d < 0.72 ? '2' : d < 1 ? '1' : '.';
      }
      grid.push(row);
    }
    pool.setAttribute('width', cols * CELL); pool.setAttribute('height', rows * CELL);
    pool.setAttribute('viewBox', `0 0 ${cols} ${rows}`);
    pool.innerHTML = `<g class="glow">${PX.sprite(grid, { pal: { 1: '#1a170b', 2: '#2a210f', 3: '#3a2c13' } })}</g>`;
  }

  $('fire').innerHTML = PX.sprite('fire1', { x: 2, y: 0, cls: 'fr f1' }) + PX.sprite('fire2', { x: 2, y: 0, cls: 'fr f2' }) + PX.sprite('fire3', { x: 2, y: 0, cls: 'fr f3' }) + PX.sprite('logs', { x: 0, y: 16 });

  /* ── Controls ────────────────────────────────────────────────────────────── */
  let playTimer = null;
  function stop() { clearInterval(playTimer); playTimer = null; }
  function next() { if (st.step < LAST) st.step++; if (st.step >= LAST) stop(); render(); }
  $('next').addEventListener('click', () => { stop(); next(); });
  $('play').addEventListener('click', () => {
    if (playTimer) { stop(); render(); return; }
    if (st.step >= LAST) { st.step = 0; st.entered = 0; }
    playTimer = setInterval(next, 1300); next();
  });
  $('reset').addEventListener('click', () => { stop(); st.step = 1; st.entered = 0; render(); });
  $('cap').addEventListener('input', (e) => { st.cap = +e.target.value; $('capout').textContent = st.cap + ' tokens'; render(); });
  $('pinbox').addEventListener('change', (e) => { st.pinned = e.target.checked; render(); });
  window.addEventListener('resize', () => requestAnimationFrame(drawPool));

  st.cap = +$('cap').value; st.pinned = $('pinbox').checked;
  $('capout').textContent = st.cap + ' tokens';
  render();
})();
</script>
</body>
</html>
